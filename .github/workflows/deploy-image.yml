name: Build and Push to GHCR

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tag
        env:
          IMAGE_REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="$REGISTRY/$owner/birthday-calendar-service"

          if [ "${IMAGE_REF_NAME}" = "main" ]; then
            tag="latest"
          else
            tag="${IMAGE_REF_NAME,,}"
            tag="${tag//\//-}"
            tag="$(echo "$tag" | sed -E 's/[^a-z0-9._-]/-/g')"
          fi

          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Will push $image:$tag"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}