name: Build and Push to GHCR

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tag
        env:
          IMAGE_REF: ${{ inputs.ref || github.ref }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="$REGISTRY/$owner/birthday-calendar-service"

          case "$IMAGE_REF" in
            refs/heads/main) tag="latest" ;;
            refs/heads/*|refs/tags/*)
              kind="${IMAGE_REF#refs/}"
              kind="${kind%%/*}"
              name="${IMAGE_REF#refs/*/}"
              name="${name,,}"
              name="$(printf '%s' "$name" | sed -E 's/[^a-z0-9._-]/-/g')"
              digest="$(printf '%s' "$IMAGE_REF" | sha256sum | cut -c1-16)"
              tag="${kind}-${name:0:104}-${digest}"
              ;;
            *) echo "Unsupported image ref: $IMAGE_REF" >&2; exit 1 ;;
          esac

          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Will push $image:$tag"

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}