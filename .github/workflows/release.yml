name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
      next_snapshot_version:
        description: 'Next snapshot version (e.g. 1.3.0-SNAPSHOT)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate release versions
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$NEXT_SNAPSHOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Expected release version X.Y.Z and next version X.Y.Z-SNAPSHOT" >&2
            exit 1
          fi

      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Java and Maven
        uses: ./.github/actions/setup-java-maven/

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Maven Release Prepare
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}
        run: |
          mvn release:prepare \
            "-DreleaseVersion=$RELEASE_VERSION" \
            "-DdevelopmentVersion=$NEXT_SNAPSHOT_VERSION" \
            -Darguments="-DskipTests -Dcheckstyle.skip" \
            -B

      - name: Maven Release Perform
        run: |
          mvn release:perform \
            -Darguments="-DskipTests -Dcheckstyle.skip -Dmaven.deploy.skip=true" \
            -B

      - name: Merge release tag into main
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          git checkout main
          git merge --no-ff "v$RELEASE_VERSION"
          git push origin main

  publish-image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-image.yml
    with:
      ref: refs/heads/main

